name: EsyLuban CI

# Why this exists
#
# Four independent reviews of this repository converged on one sentence: every
# quality guarantee here assumed "the author's machine, and the author
# remembering". The regression could only be run by hand, on Windows, by someone
# who already knew how. So "21 assertions, all green" was a claim a stranger had
# to take on faith.
#
# It was also wrong in a way nobody could have noticed locally: the SHA256
# baselines were stored with git newline normalization on, so they only matched
# on a machine with core.autocrlf=true. Anyone else cloning this repo would have
# seen 405 baseline files fail at once. A checkout on a runner is exactly the
# kind of foreign machine that catches this.
#
# Why it is not called ci.yml
#
# Upstream Luban ships its own .github/workflows/ci.yml since 5.1: an ubuntu job
# that builds the whole solution and runs src/Luban.Tests. That file is kept
# byte-for-byte, so the next upstream sync cannot conflict on it. It also does
# what this file's Linux job used to do -- show that the spreadsheet core is
# ordinary .NET that builds and passes tests off Windows -- so that job is gone.
# What stays here is what upstream cannot know about: the Windows toolchain,
# the right-click chain and the regression baselines.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows - build, unit tests, full regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream-boundary guard diffs against the pinned base commit,
          # which is an ancestor several dozen commits back. A shallow checkout
          # would not contain it, and the guard fails loudly rather than
          # silently passing -- but there is no reason to make it do that.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build runtime
        run: esyluban\scripts\build.bat
        shell: cmd

      # The migration tool's tests need openpyxl. run_unit_tests.bat skips them
      # when it is missing rather than failing, so CI would still be green
      # without this step -- but skipping is the wrong outcome here: that tool
      # rewrites spreadsheets in place with no backup, and CI is exactly where
      # its tests should run.
      - name: Install migration test deps
        run: python -m pip install --disable-pip-version-check openpyxl
        shell: cmd

      - name: Unit tests
        run: esyluban\scripts\test\run_unit_tests.bat
        shell: cmd

      # The regression is the real gate: baselines, negatives, the right-click
      # chain, the release example, and the guards that keep this repo honest.
      # Its exit code is already meaningful -- it is derived from a running
      # failure count, not from whatever the last command happened to return.
      - name: Full regression
        run: esyluban\scripts\test\run_full_tests_example.bat
        shell: cmd

      # Comparison reports make a baseline failure diagnosable from the PR page
      # instead of requiring a local reproduction.
      - name: Upload comparison reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compare-reports
          path: |
            esyluban/examples/dev/TestOutputs/compare_report*.json
            esyluban/examples/dev/TestOutputs/*.log
          if-no-files-found: ignore
